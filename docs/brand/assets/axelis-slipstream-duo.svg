<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Axelis slipstream mark, two tone">
  <title>Axelis — Slipstream (two tone)</title>
  <desc>Planet takes currentColor; the slipstream and its wake take --axelis-accent, so the pair recolours per context without editing the file.</desc>
  <defs>
    <path id="axd-w" d="M6,92 C40,80 86,52 116,22 C100,48 58,84 6,92 Z"/>
    <path id="axd-t1" d="M10,104 C34,100 60,90 84,74 C64,96 36,106 10,104 Z"/>
    <path id="axd-t2" d="M30,112 C48,110 66,103 82,93 C68,110 48,116 30,112 Z"/>
    <mask id="axd-cut">
      <rect width="120" height="120" fill="#000"/>
      <circle cx="56" cy="58" r="36" fill="#fff"/>
      <use href="#axd-w" fill="#000" transform="translate(-1,-4)"/>
    </mask>
  </defs>
  <g transform="translate(0,4) scale(.96)">
    <circle cx="56" cy="58" r="36" fill="currentColor" mask="url(#axd-cut)"/>
    <g fill="var(--axelis-accent, currentColor)">
      <use href="#axd-w"/><use href="#axd-t1"/><use href="#axd-t2"/>
    </g>
  </g>
</svg>
