<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Axelis slipstream mark">
  <title>Axelis — Slipstream (single colour)</title>
  <desc>Drawn from the original Axelis favicon: a tapering slipstream cuts through the planet, thin at the tail, fattest where it crosses the disc, with two trailing wake lines. One colour via currentColor; the cut is a real hole, so it sits on any ground.</desc>
  <defs>
    <path id="ax-w" d="M6,92 C40,80 86,52 116,22 C100,48 58,84 6,92 Z"/>
    <path id="ax-t1" d="M10,104 C34,100 60,90 84,74 C64,96 36,106 10,104 Z"/>
    <path id="ax-t2" d="M30,112 C48,110 66,103 82,93 C68,110 48,116 30,112 Z"/>
    <mask id="ax-cut">
      <rect width="120" height="120" fill="#000"/>
      <circle cx="56" cy="58" r="36" fill="#fff"/>
      <use href="#ax-w" fill="#000" transform="translate(-1,-4)"/>
    </mask>
  </defs>
  <g transform="translate(0,4) scale(.96)" fill="currentColor">
    <circle cx="56" cy="58" r="36" mask="url(#ax-cut)"/>
    <use href="#ax-w"/>
    <use href="#ax-t1"/>
    <use href="#ax-t2"/>
  </g>
</svg>
