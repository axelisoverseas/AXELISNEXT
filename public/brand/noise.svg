<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Local replacement for grainy-gradients.vercel.app/noise.svg, which was
       requested on every load of /about and /contact and had started
       returning 404. A decorative texture is not worth a third-party request
       to someone else's demo deployment, let alone a broken one. -->
  <filter id="n">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="200" height="200" filter="url(#n)"/>
</svg>
